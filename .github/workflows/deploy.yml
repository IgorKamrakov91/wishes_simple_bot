name: Deploy

# Deploys to the VPS with Kamal after CI passes on main.
# Can also be started manually from the Actions tab.
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # workflow_run fires for failed CI runs and for PR runs too: deploy only green pushes to main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Deploy exactly the commit CI tested, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Write secrets for .kamal/secrets
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          YANDEX_AI_API_KEY: ${{ secrets.YANDEX_AI_API_KEY }}
          YANDEX_AI_FOLDER_ID: ${{ secrets.YANDEX_AI_FOLDER_ID }}
        run: |
          umask 077
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key
          {
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "BOT_USERNAME=$BOT_USERNAME"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "YANDEX_AI_API_KEY=$YANDEX_AI_API_KEY"
            echo "YANDEX_AI_FOLDER_ID=$YANDEX_AI_FOLDER_ID"
          } > .env.production

      # .kamal/hooks/post-deploy registers the Telegram webhook afterwards
      - name: Deploy
        run: bin/kamal deploy
