<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Варианты аватара</title>
<style>
  body{margin:0;padding:32px;background:#f4f4f5;font:15px -apple-system,Segoe UI,sans-serif;color:#18181b}
  h1{font-size:22px;margin:0 0 20px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  .card{background:#fff;border-radius:16px;padding:16px;text-align:center}
  .big{width:200px;height:200px;border-radius:50%;display:block;margin:0 auto 12px}
  .row{display:flex;gap:10px;justify-content:center;align-items:center}
  .row img{border-radius:50%}
  .dark{background:#17212b;border-radius:10px;padding:8px;display:flex;gap:10px;justify-content:center}
  .dark img{border-radius:50%}
  b{display:block;margin-bottom:6px}
</style></head><body>
<h1>Варианты аватара · как в круге Telegram, 48 и 32 px, на тёмной теме</h1>
<div class="grid">
<div class=card><b>0 · текущий</b><img class=big src="0-current.jpg"><div class=row><img src="0-current.jpg" width=48 height=48><img src="0-current.jpg" width=32 height=32><div class=dark><img src="0-current.jpg" width=48 height=48><img src="0-current.jpg" width=32 height=32></div></div></div>
<div class=card><b>1 · Подарок с отметкой брони</b><img class=big src="1-gift-reserved.png"><div class=row><img src="1-gift-reserved.png" width=48 height=48><img src="1-gift-reserved.png" width=32 height=32><div class=dark><img src="1-gift-reserved.png" width=48 height=48><img src="1-gift-reserved.png" width=32 height=32></div></div></div>
<div class=card><b>2 · Вишлист-карточка с бантом</b><img class=big src="2-wishlist-card.png"><div class=row><img src="2-wishlist-card.png" width=48 height=48><img src="2-wishlist-card.png" width=32 height=32><div class=dark><img src="2-wishlist-card.png" width=48 height=48><img src="2-wishlist-card.png" width=32 height=32></div></div></div>
<div class=card><b>3 · Подарок в облачке Telegram</b><img class=big src="3-telegram-bubble.png"><div class=row><img src="3-telegram-bubble.png" width=48 height=48><img src="3-telegram-bubble.png" width=32 height=32><div class=dark><img src="3-telegram-bubble.png" width=48 height=48><img src="3-telegram-bubble.png" width=32 height=32></div></div></div>
<div class=card><b>4 · Бант-сердце</b><img class=big src="4-heart-bow.png"><div class=row><img src="4-heart-bow.png" width=48 height=48><img src="4-heart-bow.png" width=32 height=32><div class=dark><img src="4-heart-bow.png" width=48 height=48><img src="4-heart-bow.png" width=32 height=32></div></div></div>
<div class=card><b>5 · Ночной с золотом</b><img class=big src="5-night-gold.png"><div class=row><img src="5-night-gold.png" width=48 height=48><img src="5-night-gold.png" width=32 height=32><div class=dark><img src="5-night-gold.png" width=48 height=48><img src="5-night-gold.png" width=32 height=32></div></div></div>
<div class=card><b>6 · Подарочная бирка</b><img class=big src="6-gift-tag.png"><div class=row><img src="6-gift-tag.png" width=48 height=48><img src="6-gift-tag.png" width=32 height=32><div class=dark><img src="6-gift-tag.png" width=48 height=48><img src="6-gift-tag.png" width=32 height=32></div></div></div>
</div></body></html>
