# Kamal deploy configuration. See https://kamal-deploy.org
service: wishes_simple_bot

image: wishes_simple_bot

servers:
  web:
    - 72.56.20.126

# kamal-proxy terminates TLS with a Let's Encrypt certificate.
# sslip.io resolves <ip-with-dashes>.sslip.io to that IP, so no domain purchase is needed.
proxy:
  ssl: true
  host: 72-56-20-126.sslip.io
  healthcheck:
    path: /up

# Local registry: Kamal pushes the image to the server through an SSH tunnel,
# so no external registry account is needed.
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - TELEGRAM_BOT_TOKEN
    - BOT_USERNAME
  clear:
    # Run Solid Queue inside Puma: single small server.
    SOLID_QUEUE_IN_PUMA: true
    WEB_CONCURRENCY: 1

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "wishes_simple_bot_storage:/rails/storage"

builder:
  arch: amd64

accessories:
  db:
    # Keep the major version in sync with the data directory; upgrading needs dump/restore.
    image: postgres:17
    host: 72.56.20.126
    # Bound to localhost only: reachable from the app over the kamal docker network,
    # and from the server itself for backups, but not from the internet.
    port: "127.0.0.1:5432:5432"
    # The default container name contains underscores, which URI.parse rejects as a hostname,
    # so the app connects through this alias instead.
    options:
      network-alias: db
    env:
      clear:
        POSTGRES_USER: wishes_simple_bot
        POSTGRES_DB: wishes_simple_bot
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
