en:
  bot:
    photo_gift:
      help: |
        Gift from a photo:
        • Send the bot a photo or screenshot of a product, for example with Share from a shop app. The bot fills in the card; you check and save it.
        • Once you agree, Yandex AI receives the image and its caption — everything visible in the shot, so crop what you don't want to share. Your profile, lists, reservations and other gifts are not sent.
        • Anyone with the list link can see the gift photo. You can remove it before saving.
      received: "📥 Got it! Where should it go?"
      routing_consent: "By tapping a list, you allow the photo and caption, including future photos, to be sent to Yandex AI. Crop out personal information first."
