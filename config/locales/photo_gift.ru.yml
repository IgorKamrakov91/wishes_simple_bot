ru:
  bot:
    photo_gift:
      help: |
        Подарок по фото:
        • Пришли боту фото или скриншот товара — например, через «Поделиться» из магазина. Бот заполнит карточку, а ты проверишь и сохранишь её.
        • После твоего согласия Yandex AI получает картинку и подпись к ней — всё, что видно на снимке, поэтому лучше обрезать лишнее. Профиль, списки, брони и другие подарки не передаются.
        • Фото подарка увидят все, у кого есть ссылка на список. Его можно убрать перед сохранением.
      received: "📥 Принял! Куда положить?"
      routing_consent: "Нажимая список, разрешаешь отправить фото и подпись в Yandex AI, включая следующие фото. Лучше обрезать личное."
      to_list: "✅ В «%{list}»"
      other_lists: "Другой список…"
      later: "Разберу потом"
      deferred: "📥 Оставил во входящих на 30 дней. Можно вернуться из главного меню."
      inbox: "📥 Входящие (%{count})"
      inbox_title: "📥 Входящие — выбери фото, чтобы разобрать."
      inbox_empty: "📥 Во входящих пока пусто."
      untitled: "🖼 Фото без названия"
      consent: "Чтобы заполнить подарок, бот отправит фото и подпись в Yandex AI. На снимке может быть личная информация — лучше обрезать лишнее. После согласия следующие фото тоже будут распознаваться автоматически.\n\nМожно заполнить карточку самому — тогда фото не отправляется в ИИ."
