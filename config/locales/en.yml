      help: |
        How it works:
        1. Create a list and add gifts to it.
        2. Send it to friends with “Send to a friend” or copy the link.
        3. Friends reserve gifts so nobody gives the same thing twice.

        Who sees what:
        • Anyone with the link can open the list, and the link can be forwarded.
        • The list owner sees that a gift is taken, but not who reserved it.
        • Other guests see the name of whoever reserved it, under a spoiler.
        • If your Telegram profile's birthdate is available to the bot, it may remind guests of your lists. Dates are refreshed daily.
        • Find your reservations in “My reservations”; notifications are in “Settings”.

        Gift ideas:
        • Yandex AI receives the list name and names of recent gifts to suggest ideas. Telegram profile names, prices, links, descriptions and reservation details are not sent.
        • You can request two sets of ideas per day, using Moscow time. AI suggests ideas; check product availability and prices yourself. After adding an idea, you can search for the gift on Yandex Market.

        Almost everything works through the buttons under messages. Commands:
