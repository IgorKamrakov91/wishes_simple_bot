      unrecognized_text: "Не получилось разобрать сообщение. Чтобы добавить подарок, открой список и нажми «+ Добавить подарок»."
      help: |
        Как это работает:
        1. Создай список и добавь в него подарки.
        2. Отправь список друзьям кнопкой «Отправить другу» или скопируй ссылку.
        3. Друзья бронируют подарки, чтобы никто не подарил одно и то же.

        Кто что видит:
        • Список открывается всем, у кого есть ссылка, и её можно переслать.
        • Владелец списка видит, что подарок занят, но не видит, кто его забронировал.
        • Другие гости видят имя того, кто забронировал, под спойлером.
        • Если дата рождения в профиле Telegram доступна боту, он может напомнить о ней гостям твоих списков. Даты обновляются раз в день.
        • Свои брони ты найдёшь в разделе «Мои брони», уведомления настраиваются в «Настройках».

        Идеи подарков:
        • Для подбора Yandex AI получает название списка и названия последних подарков. Имена из профиля Telegram, цены, ссылки, описания и данные о бронях не передаются.
        • Можно запросить два подбора в сутки по Москве. AI предлагает идеи, а наличие и цену товаров нужно проверять самостоятельно. Добавив идею, можно найти подарок на Яндекс Маркете, Ozon или Wildberries.

        Почти всё делается кнопками под сообщениями. Команды:
