        text: "<b>Напоминания о бронях</b>\n\nНапоминать о забронированных подарках без отметки о покупке.\nПервое напоминание придёт через выбранное число дней после включения. Отправляем днём, с 12:00 до 18:00 по Москве.\n\nЧастота:"
