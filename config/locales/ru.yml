          <b>Настройки</b>

          Уведомления о бронях и снятии брони:
          • В моих списках — когда друзья выбирают мои подарки.
          • В списках друзей — когда другие гости выбирают подарки.

          О своих действиях уведомления не приходят. В уведомлениях о бронях не называем того, кто изменил бронь.

          Дни рождения друзей — напоминание примерно за 30 дней, если Telegram передал дату из профиля. Даты проверяем раз в день.
          Нажми кнопку, чтобы изменить настройку.
